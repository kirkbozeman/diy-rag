[dependency-groups]
dev = ["ruff==0.16.9", "pre-commit==4.6.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "D",   # pydocstyle
]
ignore = [
    "D1",  # don't require docstrings, only format those that exist
]

[tool.ruff.lint.pydocstyle]
convention = "google"
